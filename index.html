<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipbook Aset Kripto - Full Screen Responsive</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>

    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; padding: 0; background: #121212; 
            width: 100vw; height: 100vh; overflow: hidden; 
            font-family: system-ui, -apple-system, sans-serif;
        }
        
        #canvas-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        #book-container { 
            visibility: hidden; 
            box-shadow: 0 30px 70px rgba(0,0,0,0.8);
        }
        
        /* CSS DIBUAT BERSIH: Biarkan engine page-flip yang mengontrol manipulasi 3D-nya */
        .page-content { 
            background: white; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
        }
        
        canvas { 
            width: 100% !important; 
            height: 100% !important; 
            display: block; 
            object-fit: contain;
        }
        
        #loader { 
            position: fixed; color: white; z-index: 100; background: #121212; inset: 0;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; padding: 20px;
        }
        .spinner { 
            border: 4px solid rgba(255,255,255,0.1); border-left-color: #38bdf8; 
            border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite; margin-bottom: 15px;
        }
        #percent { color: #38bdf8; font-weight: bold; display: block; margin-top: 5px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <p>Membuka Materi... <span id="percent">Menghubungkan ke PDF...</span></p>
    </div>

    <div id="canvas-container">
        <div id="book-container"></div>
    </div>

    <script>
        const pdfPath = 'materi.pdf'; 
        const container = document.getElementById('book-container');
        const percentText = document.getElementById('percent');
        
        let pageFlip = null;
        let pdfRatio = 1.414; 

        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        function calculateBookSize() {
            const isDesktop = window.innerWidth >= 768;
            const maxAllocatedWidth = window.innerWidth * 0.92; 
            const maxAllocatedHeight = window.innerHeight * 0.86; 

            let maxSinglePageWidth = isDesktop ? maxAllocatedWidth / 2 : maxAllocatedWidth;
            let maxSinglePageHeight = maxAllocatedHeight;

            let finalSingleWidth, finalSingleHeight;

            if ((maxSinglePageWidth * pdfRatio) <= maxSinglePageHeight) {
                finalSingleWidth = maxSinglePageWidth;
                finalSingleHeight = finalSingleWidth * pdfRatio;
            } else {
                finalSingleHeight = maxSinglePageHeight;
                finalSingleWidth = finalSingleHeight / pdfRatio;
            }

            return {
                width: Math.round(finalSingleWidth),
                height: Math.round(finalSingleHeight),
                containerWidth: Math.round(isDesktop ? finalSingleWidth * 2 : finalSingleWidth),
                containerHeight: Math.round(finalSingleHeight)
            };
        }

        async function initFlipbook() {
            try {
                const loadingTask = pdfjsLib.getDocument(pdfPath);
                const pdf = await loadingTask.promise;
                const totalPages = pdf.numPages;

                const firstPage = await pdf.getPage(1);
                const originalViewport = firstPage.getViewport({ scale: 1.0 });
                pdfRatio = originalViewport.height / originalViewport.width;
                
                const size = calculateBookSize();
                container.style.width = size.containerWidth + 'px';
                container.style.height = size.containerHeight + 'px';

                for (let i = 1; i <= totalPages; i++) {
                    percentText.innerText = `Memproses halaman ${i} dari ${totalPages}... (${Math.round((i / totalPages) * 100)}%)`;
                    
                    const page = await pdf.getPage(i);
                    const renderViewport = page.getViewport({ scale: 2.0 }); 
                    
                    const pageDiv = document.createElement('div');
                    pageDiv.className = 'page-content';
                    
                    // Set Hardcover hanya pada halaman pertama dan terakhir
                    if (i === 1 || i === totalPages) {
                        pageDiv.setAttribute('data-density', 'hard');
                    }
                    
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.width = renderViewport.width;
                    canvas.height = renderViewport.height;
                    
                    await page.render({ canvasContext: context, viewport: renderViewport }).promise;
                    
                    pageDiv.appendChild(canvas);
                    container.appendChild(pageDiv);
                }

                document.getElementById('loader').style.display = 'none';
                container.style.visibility = 'visible';

                // Jeda micro-second agar RAM browser bersih sebelum inisialisasi dilakukan
                setTimeout(() => {
                    const isDesktop = window.innerWidth >= 768;

                    pageFlip = new St.PageFlip(container, {
                        width: size.width, 
                        height: size.height, 
                        size: "stretch", 
                        minWidth: 200, maxWidth: 4000,
                        minHeight: 200, maxHeight: 4000,
                        showCover: true,
                        // FIX: Gunakan mode 'double' di desktop dan 'portrait' di HP secara dinamis
                        mode: isDesktop ? 'double' : 'portrait', 
                        flippingTime: 1000, // Diperlambat sedikit (1 detik) agar ayunan fisik kertas terasa anggun
                        drawShadow: true,
                        maxShadowOpacity: 0.3
                    });

                    pageFlip.loadFromHTML(document.querySelectorAll(".page-content"));
                }, 150);

                window.addEventListener('resize', () => {
                    if (!pageFlip) return;
                    const newSize = calculateBookSize();
                    const isDesktop = window.innerWidth >= 768;
                    
                    container.style.width = newSize.containerWidth + 'px';
                    container.style.height = newSize.containerHeight + 'px';
                    
                    // Update mode secara real-time jika user mengubah ukuran browser desktop ke mobile
                    pageFlip.update({
                        width: newSize.width,
                        height: newSize.height,
                        mode: isDesktop ? 'double' : 'portrait'
                    });
                });

            } catch (error) {
                console.error(error);
                percentText.innerHTML = `<span style="color: #f87171; display:block; margin-top:10px;">Gagal memuat dokumen PDF. Pastikan file tersedia.</span>`;
            }
        }

        initFlipbook();
    </script>
</body>
</html>
