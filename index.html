<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipbook Aset Kripto - Full Screen</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>

    <style>
        * { box-sizing: border-box; }
        
        /* Mengunci layar agar buku saku selalu persis di tengah */
        body { 
            margin: 0; padding: 0; background: #121212; 
            height: 100vh; width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; 
            font-family: system-ui, sans-serif;
        }
        
        /* Membatasi ruang mekar buku saku agar tidak jadi raksasa */
        .wadah-buku {
            width: 95vw; 
            height: 95vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #book { 
            display: none; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }
        
        .page { 
            background-color: white; 
            overflow: hidden; 
        }
        
        .page canvas { 
            width: 100%; 
            height: 100%; 
            display: block; 
        }
        
        #loader { 
            position: fixed; inset: 0; background: #121212; color: white; z-index: 100;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center;
        }
        .spinner { 
            border: 4px solid rgba(255,255,255,0.1); border-left-color: #38bdf8; 
            border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite; margin-bottom: 15px;
        }
        #progress { color: #38bdf8; font-weight: bold; margin-top: 5px; display: block;}
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <p>Membuka Panduan... <span id="progress">0%</span></p>
    </div>

    <div class="wadah-buku">
        <div id="book"></div>
    </div>

    <script>
        const pdfPath = 'materi.pdf'; 
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        async function init() {
            try {
                const pdf = await pdfjsLib.getDocument(pdfPath).promise;
                const total = pdf.numPages;
                const bookEl = document.getElementById('book');
                
                // Ambil ukuran asli buku saku dari halaman 1
                const page1 = await pdf.getPage(1);
                const viewport = page1.getViewport({ scale: 1.5 });
                const baseWidth = viewport.width;
                const baseHeight = viewport.height;

                for(let i = 1; i <= total; i++) {
                    document.getElementById('progress').innerText = `${Math.round((i/total)*100)}%`;
                    
                    const page = await pdf.getPage(i);
                    // Render HD untuk teks
                    const renderViewport = page.getViewport({ scale: 2.0 }); 
                    
                    const pageDiv = document.createElement('div');
                    pageDiv.className = 'page';
                    
                    // Kunci anti-patah engsel untuk cover dan isi
                    pageDiv.setAttribute('data-density', 'soft'); 
                    
                    const canvas = document.createElement('canvas');
                    canvas.width = renderViewport.width;
                    canvas.height = renderViewport.height;
                    const ctx = canvas.getContext('2d');
                    await page.render({ canvasContext: ctx, viewport: renderViewport }).promise;
                    
                    pageDiv.appendChild(canvas);
                    bookEl.appendChild(pageDiv);
                }

                document.getElementById('loader').style.display = 'none';
                bookEl.style.display = 'block';

                const isDesktop = window.innerWidth >= 768;

                const pageFlip = new St.PageFlip(bookEl, {
                    width: baseWidth,   
                    height: baseHeight, 
                    size: "fit", // Sekarang 'fit' dijamin aman karena dikurung di dalam Flexbox
                    showCover: true,
                    mode: isDesktop ? 'double' : 'portrait',
                    drawShadow: true,
                    maxShadowOpacity: 0.3
                });

                pageFlip.loadFromHTML(document.querySelectorAll('.page'));

                window.addEventListener('resize', () => {
                    const desktopMode = window.innerWidth >= 768;
                    pageFlip.update({
                        mode: desktopMode ? 'double' : 'portrait'
                    });
                });

            } catch (error) {
                console.error(error);
                document.getElementById('loader').innerHTML = `<p style="color: #f87171;">Gagal memuat materi.pdf</p>`;
            }
        }

        init();
    </script>
</body>
</html>
