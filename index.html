<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipbook Aset Kripto - Stable & Responsive</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>

    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; background: #121212; display: flex; justify-content: center; 
            align-items: center; height: 100vh; width: 100vw; overflow: hidden; padding: 3vh 3vw; 
        }
        #canvas-container {
            width: 100%; height: 100%; max-width: 1300px; max-height: 85vh;
            display: flex; justify-content: center; align-items: center; perspective: 2000px;
        }
        #book-container { 
            visibility: hidden; box-shadow: 0 25px 60px rgba(0,0,0,0.8); width: 100%; height: 100%;
        }
        .page-content { background: white; width: 100%; height: 100%; overflow: hidden; }
        canvas { width: 100% !important; height: 100% !important; display: block; object-fit: contain; }
        
        #loader { 
            position: fixed; color: white; z-index: 100; background: #121212; inset: 0;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-family: system-ui, -apple-system, sans-serif; text-align: center; padding: 20px;
        }
        .spinner { 
            border: 4px solid rgba(255,255,255,0.1); border-left-color: #38bdf8; 
            border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite; margin-bottom: 15px;
        }
        #percent { color: #38bdf8; font-weight: bold; display: block; margin-top: 5px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <p>Membuka Materi... <span id="percent">Menghubungkan ke PDF...</span></p>
    </div>

    <div id="canvas-container">
        <div id="book-container"></div>
    </div>

    <script>
        const pdfPath = 'materi.pdf'; 
        const container = document.getElementById('book-container');
        const percentText = document.getElementById('percent');
        
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        async function initFlipbook() {
            try {
                const loadingTask = pdfjsLib.getDocument(pdfPath);
                const pdf = await loadingTask.promise;
                const totalPages = pdf.numPages;

                // 1. Deteksi aspek rasio asli dokumen dari halaman pertama
                const firstPage = await pdf.getPage(1);
                const originalViewport = firstPage.getViewport({ scale: 1.0 });
                
                const baseWidth = 500;
                const baseHeight = baseWidth * (originalViewport.height / originalViewport.width);
                
                // Skala 1.3: Super cepat di-render, memori aman, teks tetap tajam
                const renderViewport = firstPage.getViewport({ scale: 1.3 });

                // 2. Render seluruh halaman secara sekuensial dengan indikator progres yang jelas
                for (let i = 1; i <= totalPages; i++) {
                    percentText.innerText = `Memproses halaman ${i} dari ${totalPages}... (${Math.round((i / totalPages) * 100)}%)`;
                    
                    const page = await pdf.getPage(i);
                    const pageDiv = document.createElement('div');
                    pageDiv.className = 'page-content';
                    
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.width = renderViewport.width;
                    canvas.height = renderViewport.height;
                    
                    await page.render({ canvasContext: context, viewport: renderViewport }).promise;
                    
                    pageDiv.appendChild(canvas);
                    container.appendChild(pageDiv);
                }

                // 3. Hilangkan loader setelah semua halaman siap masuk cetakan
                document.getElementById('loader').style.display = 'none';
                container.style.visibility = 'visible';

                // 4. Jalankan mesin PageFlip
                const pageFlip = new St.PageFlip(container, {
                    width: baseWidth, 
                    height: baseHeight, 
                    size: "stretch", // Mengikuti ukuran layar secara fleksibel
                    minWidth: 250, maxWidth: 1400,
                    minHeight: 350, maxHeight: 2000,
                    showCover: true,
                    usePortrait: true, // Otomatis 1 halaman di HP tegak, 2 halaman di laptop/PC
                    flippingTime: 600,
                    drawShadow: true
                });

                pageFlip.loadFromHTML(document.querySelectorAll(".page-content"));

                // 5. Paksa flipbook kalkulasi ulang ukuran jika browser di-resize atau HP diputar (Landscape/Portrait)
                window.addEventListener('resize', () => {
                    pageFlip.update();
                });

            } catch (error) {
                console.error(error);
                // Menampilkan pesan edukasi jika terjadi kesalahan teknis path/CORS
                percentText.innerHTML = `
                    <span style="color: #f87171; display:block; margin-top:10px;">Gagal memuat dokumen!</span>
                    <small style="color: #9ca3af; font-weight:normal; display:block; margin-top:5px; line-height:1.4;">
                        Penyebab umum:<br>
                        1. File <b>"${pdfPath}"</b> belum ditaruh di folder yang sama.<br>
                        2. Anda membuka file HTML langsung (double click file). Browser memblokir PDF demi keamanan.<br>
                        <i>Solusi: Jalankan menggunakan Live Server di VS Code atau hosting.</i>
                    </small>
                `;
            }
        }

        initFlipbook();
    </script>
</body>
</html>
