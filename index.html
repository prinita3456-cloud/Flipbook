<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipbook Aset Kripto - Full Screen Responsive</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>

    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; padding: 0; background: #121212; 
            width: 100vw; height: 100vh; overflow: hidden; 
            font-family: system-ui, -apple-system, sans-serif;
        }
        
        /* Wadah utama dipaksa memenuhi 100% layar monitor / popup */
        #canvas-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        
        /* Buku diletakkan di tengah-tengah secara absolut */
        #book-container { 
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            visibility: hidden; 
            box-shadow: 0 30px 70px rgba(0,0,0,0.9);
        }
        
        .page-content { background: white; width: 100%; height: 100%; overflow: hidden; }
        canvas { width: 100% !important; height: 100% !important; display: block; object-fit: fill; }
        
        #loader { 
            position: fixed; color: white; z-index: 100; background: #121212; inset: 0;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; padding: 20px;
        }
        .spinner { 
            border: 4px solid rgba(255,255,255,0.1); border-left-color: #38bdf8; 
            border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite; margin-bottom: 15px;
        }
        #percent { color: #38bdf8; font-weight: bold; display: block; margin-top: 5px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <p>Membuka Materi... <span id="percent">Menghubungkan ke PDF...</span></p>
    </div>

    <div id="canvas-container">
        <div id="book-container"></div>
    </div>

    <script>
        const pdfPath = 'materi.pdf'; 
        const container = document.getElementById('book-container');
        const percentText = document.getElementById('percent');
        
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        async function initFlipbook() {
            try {
                const loadingTask = pdfjsLib.getDocument(pdfPath);
                const pdf = await loadingTask.promise;
                const totalPages = pdf.numPages;

                // 1. Ambil aspek rasio asli dokumen
                const firstPage = await pdf.getPage(1);
                const originalViewport = firstPage.getViewport({ scale: 1.0 });
                
                // Menentukan ukuran dasar aspek rasio
                const baseWidth = 500;
                const baseHeight = baseWidth * (originalViewport.height / originalViewport.width);
                
                // Menggunakan skala 1.5 agar teks tetap tajam saat diregangkan ke layar besar
                const renderViewport = firstPage.getViewport({ scale: 1.5 });

                // 2. Render seluruh halaman ke dalam struktur HTML
                for (let i = 1; i <= totalPages; i++) {
                    percentText.innerText = `Memproses halaman ${i} dari ${totalPages}... (${Math.round((i / totalPages) * 100)}%)`;
                    
                    const page = await pdf.getPage(i);
                    const pageDiv = document.createElement('div');
                    pageDiv.className = 'page-content';
                    
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.width = renderViewport.width;
                    canvas.height = renderViewport.height;
                    
                    await page.render({ canvasContext: context, viewport: renderViewport }).promise;
                    
                    pageDiv.appendChild(canvas);
                    container.appendChild(pageDiv);
                }

                // 3. Tampilkan kontainer utama
                document.getElementById('loader').style.display = 'none';
                container.style.visibility = 'visible';

                // 4. Jalankan mesin PageFlip dengan setelan maksi (Mendukung resolusi tinggi/4K)
                const pageFlip = new St.PageFlip(container, {
                    width: baseWidth, 
                    height: baseHeight, 
                    size: "stretch", // Memaksa meregang mengikuti wadah luar
                    minWidth: 200, 
                    maxWidth: 3000,  // Batas atas dilebarkan agar tidak mengunci ukuran kecil
                    minHeight: 200, 
                    maxHeight: 3000, // Batas atas dilebarkan agar tidak mengunci ukuran kecil
                    showCover: true,
                    usePortrait: true, 
                    flippingTime: 600,
                    drawShadow: true
                });

                pageFlip.loadFromHTML(document.querySelectorAll(".page-content"));

                // 5. Otomatis hitung ulang ukuran buku jika ukuran browser di-resize atau popup berubah ukuran
                window.addEventListener('resize', () => {
                    pageFlip.update();
                });

            } catch (error) {
                console.error(error);
                percentText.innerHTML = `<span style="color: #f87171; display:block; margin-top:10px;">Gagal memuat dokumen PDF. Pastikan file tersedia.</span>`;
            }
        }

        initFlipbook();
    </script>
</body>
</html>
